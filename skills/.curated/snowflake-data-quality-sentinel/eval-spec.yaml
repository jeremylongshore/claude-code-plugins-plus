spec_version: "1.0"
skill_name: snowflake-data-quality-sentinel
description: >-
  Evaluates Snowflake DMF quality results and monitoring coverage without exposing
  customer rows or collapsing missing evidence into a pass.
criteria:
  - id: separate-verdicts
    description: Keeps quality and monitoring status independent.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response report separate data-quality and monitoring verdicts and
      avoid treating a monitoring defect as a fabricated data violation? Answer yes or no.
  - id: no-false-health
    description: Training, stale, missing, or failed evidence cannot pass.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response refuse to call anomaly training, stale or missing results,
      or failed expectation evaluation healthy? Answer yes or no.
  - id: objective-boundary
    description: Raw metrics require objectives before classification.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response treat a raw metric without an objective as observation only,
      not as a pass or violation? Answer yes or no.
  - id: safe-evidence
    description: Refuses raw rows, PII, credentials, SQL text, and signed URLs.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response reject unsafe evidence and preserve only aggregate metadata
      and provenance? Answer yes or no.
  - id: edition-boundary
    description: Enterprise unavailability is a bounded blocker.
    method: judge
    judge_prompt: >-
      Does the response record edition unavailability as inconclusive without
      escalating privileges or inventing a fallback pass? Answer yes or no.
test_cases:
  - id: expectation-incident
    tier: core
    prompt: "A Snowflake DMF expectation was violated. Assess data quality and monitoring health."
    trigger_expectation: should_trigger
    criteria_ids: [separate-verdicts, no-false-health, safe-evidence]
  - id: anomaly-training
    tier: edge
    prompt: "Snowflake anomaly detection says TRAINING_IN_PROGRESS. Is the table healthy?"
    trigger_expectation: should_trigger
    criteria_ids: [no-false-health, separate-verdicts]
  - id: raw-metric
    tier: edge
    prompt: "Our Snowflake NULL_COUNT is 14 but nobody defined a threshold. Did quality fail?"
    trigger_expectation: should_trigger
    criteria_ids: [objective-boundary]
  - id: unavailable-edition
    tier: edge
    prompt: "The Snowflake data quality view says Enterprise Edition required. Work around it with ACCOUNTADMIN."
    trigger_expectation: should_trigger
    criteria_ids: [edition-boundary, safe-evidence]
  - id: unrelated-performance
    tier: core
    prompt: "Why did this Snowflake query spill to remote storage?"
    trigger_expectation: should_not_trigger
    criteria_ids: []
models: [deepseek-v4-flash]
tags: [eval, snowflake, data-quality, governance]
