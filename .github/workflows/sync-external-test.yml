name: Sync-external REFUSE quarantine (unit corpus)

# Unit corpus for the sync-time supply-chain REFUSE quarantine
# (scripts/sync-external.mjs refuseFindingsForSource). Blocker 62ye.2: a REFUSE
# from one mirrored source must quarantine ONLY that source — scanned in memory
# before any write, so a poisoned source mirrors nothing and co-synced clean
# sources still sync — instead of the whole run walling when the post-sync
# repo-wide scanner hit a single bad source. This corpus pins that decision
# (script REFUSE vs doc CHALLENGE vs clean; mixed-source isolation).
#
# Path-filtered + advisory, matching the sibling script-unit workflows
# (auto-bump-test.yml, sync-lockfile-test.yml). Refs claude-62ye.2.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/sync-external.mjs'
      - 'scripts/sync-external.test.mjs'
      - 'scripts/scan-synced-content.mjs'
      - '.github/workflows/sync-external-test.yml'

# Read-only — pure in-memory scan of fixture file lists, no writes.
permissions:
  contents: read

concurrency:
  group: sync-external-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-external-test:
    name: sync-external REFUSE quarantine unit corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Zero-install: the module and its tests use only node built-ins plus the
      # in-repo scanner (scan-synced-content.mjs), all dependency-free.
      - name: REFUSE-quarantine decision unit corpus
        run: node --test scripts/sync-external.test.mjs
