name: 'MiniMax Code Review'

# In-repo advisory AI reviewer (enforcement travels with the code).
#
# ADVISORY ONLY — never a required check, never in `ci-required`'s needs, never
# blocks a merge. The deterministic gate is always `ci-required` + `gitleaks`.
#
# SAFE-FOR-FORKS design: runs on `pull_request` (NOT pull_request_target), so a
# forked PR never receives the MINIMAX_API_KEY secret. The same-repo guard below
# skips fork PRs cleanly instead of failing on an empty key — same rationale as
# auto-bump-on-pr.yml (a write-capable secret must never reach fork code). Your
# own branch PRs (pushed to this repo) are same-repo and get reviewed.
#
# The action fetches the PR diff via the API — it does NOT check out or execute
# PR-authored code.
#
# Activation (all owner UI/secret actions — cannot be done from the repo):
#   1. Repo secret  MINIMAX_API_KEY          = your MiniMax API key
#   2. Repo variable ENABLE_MINIMAX_REVIEW   = true         (kill switch)
#   3. Repo variable MINIMAX_MODEL           = <your exact M3 model id from the
#      MiniMax dashboard, e.g. MiniMax-M3>. If unset it falls back to
#      MiniMax-M2.5. A wrong model id is the usual cause of a review "error"
#      status, so set this to the exact string your token serves.
#   Optional: MINIMAX_MAX_DIFF_CHARS (default 60000), MINIMAX_SYSTEM_PROMPT
#      (overrides the repo-tailored prompt below).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: 'minimax-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dormant until the owner enables it, and only for same-repo PRs (fork PRs
    # have no secret). Both conditions must hold — no noise before activation.
    if: >-
      ${{ vars.ENABLE_MINIMAX_REVIEW == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: MiniMax code review
        # tarmojussila/minimax-code-review@v0.4.0 — SHA-pinned per supply-chain policy
        uses: tarmojussila/minimax-code-review@798f7f28a065ea877690b0092ac11f3e61c79609
        with:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # Set repo variable MINIMAX_MODEL to your exact M3 model id; falls back to M2.5.
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M2.5' }}
          MINIMAX_REVIEWER_NAME: 'MiniMax Review'
          MAX_DIFF_CHARS: ${{ vars.MINIMAX_MAX_DIFF_CHARS || '60000' }}
          # Skip generated / auto-synced / vendored files so the review spends
          # tokens on human-authored change only.
          EXCLUDE_PATTERNS: '*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml,**/dist/**,**/node_modules/**,.claude-plugin/marketplace.json,plugins/**/package.json,marketplace/src/data/**,marketplace/public/downloads/**,marketplace/.astro/**,freshie/*.sqlite,skills/.curated/**,**/*.min.js'
          # Repo-tailored reviewer brief. Override with the MINIMAX_SYSTEM_PROMPT var.
          MINIMAX_SYSTEM_PROMPT: >-
            ${{ vars.MINIMAX_SYSTEM_PROMPT || 'You are an advisory code reviewer for
            "Tons of Skills", a Claude Code plugins + skills marketplace: a pnpm
            monorepo with an Astro site (marketplace/), a Python validator
            (scripts/validate-skills-schema.py), and plugins under plugins/**.
            Report only high-signal, real problems, ranked most severe first:
            correctness bugs; security issues (especially in anything under
            plugins/** that is synced from external sources); leaked secrets or
            credentials; SKILL.md frontmatter that is missing any of the 8 required
            marketplace fields (name, description, allowed-tools, version, author,
            license, compatibility, tags); invalid plugin.json or agent frontmatter;
            and hand-edits to GENERATED files that must never be edited by hand
            (.claude-plugin/marketplace.json, plugins/**/package.json, the README
            AUTO-TOC block) — those are regenerated by pnpm run sync-marketplace.
            Do NOT restate what CI already enforces: formatting, lint, and style are
            covered by prettier, eslint, ruff, and markdownlint — skip pure nits.
            Be concise. If the change looks correct and safe, say so briefly. You are
            advisory only and never block a merge.' }}
