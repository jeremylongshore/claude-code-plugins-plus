name: E2E Tests

# Heavy tests — Playwright UI suite + production-e2e against tonsofskills.com.
# Combined runtime ~14 min. Trigger policy is tiered:
#
#   1. Path-filtered PRs — only fire when the diff actually touches UI surface
#      that could break visually. Catalog-only PRs, doc PRs, plugin-content
#      PRs, and CI config PRs don't run these.
#   2. Push to main — runs the LOCAL playwright-tests build suite after merge
#      so we catch any regression that slipped through the path filter.
#      production-e2e does NOT run on push (see 3).
#   3. workflow_run on the VPS deploy — production-e2e drives the LIVE site, so
#      on main it must run AFTER "Deploy tonsofskills.com to VPS" finishes.
#      Both workflows used to trigger on push:main with no ordering, so the
#      prod suite raced the rsync and asserted against the pre-deploy site
#      (false red on content about to ship, or false green masking a deploy
#      regression). The workflow_run trigger, guarded on
#      `conclusion == 'success'`, guarantees deploy-then-test ordering. The
#      deploy's paths (marketplace/**) are a superset of this workflow's UI
#      paths, so every UI-touching main push still gets a prod run — via the
#      deploy, in order.
#   4. workflow_dispatch — manual opt-in for PRs that fell outside the path
#      filter but need a sanity check (e.g., catalog PR that touches a featured
#      plugin's spotlight). Run via: gh workflow run e2e-tests.yml --ref <branch>.
#
# Required-check policy: NOT in the required-checks set. validate +
# marketplace-validation cover the spec gates. E2E catches visual/runtime
# regressions; failures here are signal, not gate.

on:
  workflow_dispatch:
  # Post-deploy trigger for production-e2e (see header note 3). Only fires
  # from main (workflow_run always uses the default branch's workflow file).
  workflow_run:
    workflows: ['Deploy tonsofskills.com to VPS']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'marketplace/src/components/**'
      - 'marketplace/src/pages/**'
      - 'marketplace/src/layouts/**'
      - 'marketplace/src/styles/**'
      - 'marketplace/src/scripts/**'
      - 'marketplace/public/**'
      # Regenerated catalog data (JSON) is not a UI change — excluding it stops
      # every plugin PR (which touches this dir via sync-marketplace) from
      # triggering the ~14-min Playwright E2E. Honors this workflow's own policy.
      - '!marketplace/public/data/**'
      - 'marketplace/astro.config.mjs'
      - 'marketplace/playwright.config.ts'
      - 'marketplace/playwright.production.config.ts'
      - 'marketplace/tests/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'marketplace/src/components/**'
      - 'marketplace/src/pages/**'
      - 'marketplace/src/layouts/**'
      - 'marketplace/src/styles/**'
      - 'marketplace/src/scripts/**'
      - 'marketplace/public/**'
      # Regenerated catalog data (JSON) is not a UI change — excluding it stops
      # every plugin PR (which touches this dir via sync-marketplace) from
      # triggering the ~14-min Playwright E2E. Honors this workflow's own policy.
      - '!marketplace/public/data/**'
      - 'marketplace/astro.config.mjs'
      - 'marketplace/playwright.config.ts'
      - 'marketplace/playwright.production.config.ts'
      - 'marketplace/tests/**'
      - '.github/workflows/e2e-tests.yml'

# Cancel in-flight runs when a new push lands on the same PR/branch. The event
# name is part of the group ON PURPOSE: workflow_run events carry the default
# branch ref, so without it a post-deploy production-e2e run (starting minutes
# after the push) would share a group with — and cancel — the push's still-
# running local playwright-tests. Successive events of the SAME kind still
# supersede each other (newer PR push cancels the older run; a newer deploy's
# prod suite cancels an older in-flight one).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Playwright UI tests against a locally-built marketplace. PROOF GATE for
  # UI-touching PRs — catches breakage before it reaches production.
  playwright-tests:
    runs-on: ubuntu-latest
    # Deploy-completion events are production-e2e's trigger only; the local
    # build suite already ran on the push/PR that produced the deploy.
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Astro requires >=22.12.0 as of 2026-05-30. Job builds the
          # marketplace before running Playwright, so it needs Node 22.
          node-version: 22

      - name: Install marketplace dependencies
        run: |
          cd marketplace
          npm install --ignore-scripts

      - name: Install Playwright
        run: |
          cd marketplace
          npm install -D @playwright/test

      - name: Install Playwright browsers
        run: |
          cd marketplace
          npx playwright install --with-deps chromium webkit

      - name: Build marketplace
        run: |
          cd marketplace
          npm run build

      - name: Run Playwright tests
        run: |
          cd marketplace
          npx playwright test --reporter=html,github
        env:
          CI: true

      # A11y smoke tests (issue #588) — gate-wired-but-non-blocking. The spec
      # baselines the current violation count per page; cleanup is tracked
      # separately under the a11y-cleanup-followup workstream. Run explicitly
      # so the result shows up as its own CI step.
      - name: Run a11y baseline tests
        run: |
          cd marketplace
          npx playwright test tests/a11y/ --reporter=list
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: marketplace/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-screenshots
          path: marketplace/test-results/screenshots/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-videos
          path: marketplace/test-results/**/video.webm
          retention-days: 7

  # Production E2E against live tonsofskills.com. No build needed — drives a
  # real browser against the deployed site. Useful for detecting deploy/CDN
  # issues that local builds can't catch.
  #
  # On main this job runs ONLY via workflow_run after the VPS deploy succeeded
  # (never on the raw push — see header note 3), so it always tests the newly-
  # deployed site instead of racing the rsync. A failed/cancelled deploy runs
  # nothing: there is no new deployment to verify, and the deploy workflow's
  # own healthz/smoke steps already flagged the failure.
  production-e2e:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install marketplace dependencies
        run: |
          cd marketplace
          npm install --ignore-scripts

      - name: Install Playwright
        run: |
          cd marketplace
          npm install -D @playwright/test

      - name: Install Playwright browsers
        run: |
          cd marketplace
          npx playwright install --with-deps chromium webkit

      - name: Run production E2E tests
        run: |
          cd marketplace
          npx playwright test --config=playwright.production.config.ts --reporter=html,github
        env:
          CI: true

      - name: Upload production E2E report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-e2e-report
          path: marketplace/production-e2e-report/
          retention-days: 30
