# gitleaks configuration for claude-code-plugins-plus-skills
#
# Primary secret scanner (replaces the ad-hoc regex scan in validate-plugins.yml
# for the purpose of catching leaked credentials). The repo also runs trufflehog
# on a weekly schedule against the full history as a verified-credentials check.
#
# Extends the upstream default ruleset. Add repo-specific rules for Anthropic,
# Firebase, and GCP credential shapes. Allowlists exclude documentation
# examples, test fixtures, and plugin author-provided placeholder tokens.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api03|admin01)-[A-Za-z0-9_-]{95,}'''
tags = ["key", "anthropic"]

[[rules]]
id = "firebase-service-account"
description = "Firebase / GCP service-account private key block"
regex = '''-----BEGIN PRIVATE KEY-----[\s\S]+?-----END PRIVATE KEY-----'''
tags = ["key", "gcp", "firebase"]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{40,}'''
tags = ["key", "groq"]

[[rules]]
id = "slack-webhook"
description = "Slack incoming webhook URL"
regex = '''https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{24,}'''
tags = ["url", "slack"]

[allowlist]
description = "Repo-wide allowlist for documentation, tests, and placeholder fixtures."
paths = [
    '''(?i).*/README\.md$''',
    '''(?i).*/CHANGELOG\.md$''',
    '''(?i).*/SKILL\.md$''',
    '''(?i).*/references/.*\.md$''',
    '''.*/tests?/.*''',
    '''.*/__tests__/.*''',
    '''.*/fixtures/.*''',
    # *.test.ts / *.spec.ts at any depth — test files often hold leak-canary
    # fixtures (e.g., xoxb-SECRET-LEAK-CANARY-..., eyJ.eyJ.abc JWT shapes) to
    # verify redaction logic. The tests/ glob above misses files that live at
    # module root rather than under a tests/ subdir (e.g.
    # plugins/mcp/slack-channel/server.test.ts).
    '''.*\.(test|spec)\.(ts|js|tsx|jsx|mjs|cjs)$''',
    '''^plugins/mcp/.*/dist/.*\.js$''',
    '''^\.gitleaks\.toml$''',
    '''^scripts/validate-skills-schema\.py$''',
    '''^freshie/.*''',
    '''^marketplace/src/data/.*\.json$''',
    # Runtime mirror of src/data/ — `marketplace/scripts/build.mjs` copies
    # skills-catalog.json + unified-search-index.json into public/data/ so
    # they're served as static assets. Same content, same allowlist scope
    # as the source (which is already allowlisted above). Without this,
    # gitleaks re-scans the demo Supabase JWTs and other documentation
    # examples that live inside SKILL.md body content bundled into these
    # generated files. SKILL.md itself is allowlisted; the bundled mirror
    # must follow suit or every catalog regen turns CI red.
    '''^marketplace/public/data/.*\.json$''',
    '''^marketplace/dist/.*''',
    # The hardcoded-secrets scanner ships the canonical detector pattern
    # library (BEGIN-PRIVATE-KEY headers, AWS AKIA prefix shapes, vendor
    # API-key prefixes). Gitleaks's own rules flag those literal pattern
    # strings as if they were keys. Allowlist the file so the detector
    # library is not re-read as a leak surface.
    '''^plugins/security/penetration-tester/skills/scanning-for-hardcoded-secrets/scripts/scan_secrets\.py$''',

    # --- Documentation / illustrative-example surfaces (2026-07-09 audit) ---
    # The weekly full-history scan (fetch-depth: 0) surfaced 87 findings, all
    # illustrative example creds in prose/templates — no real credential. Each
    # pattern below is grounded in a real finding from run 28731012059.
    #
    # Home-level security guides carry `API_KEY="sk-..."` teaching examples
    # (generic-api-key, stripe-access-token hits in 000-docs/*.md incl. the
    # 6767-d extensions-schema and 071 user-security guide).
    '''^000-docs/.*\.md$''',
    '''^SECURITY\.md$''',
    '''^CREDENTIAL-MIGRATION-READY\.md$''',
    # Prior path of the user-security guide (renamed into 000-docs/); still
    # reachable via history on the full-depth scan.
    '''^docs/USER_SECURITY_GUIDE\.md$''',
    # Plugin documentation surfaces — command/agent/plugin-docs markdown and
    # skill-adapter example assets hold curl-auth-header / generic-api-key /
    # jwt teaching examples (security-scanner, penetration-tester, crypto
    # audit, api-* generators, on-chain-analytics, etc.). These are prose docs
    # and generated example templates, not executable secrets; real plugin
    # code (.py/.ts/.js/.sh) stays in scope.
    '''^plugins/.*/commands/.*\.md$''',
    '''^plugins/.*/agents/.*\.md$''',
    '''^plugins/.*/docs/.*\.md$''',
    '''^plugins/.*/skills/skill-adapter/assets/.*''',
    # Deleted `backups/` tree — a snapshot of plugin docs removed from HEAD but
    # still reachable through git history under fetch-depth: 0. It re-tripped
    # ~60 of the 87 findings every scheduled run. The tree no longer exists in
    # the working copy; scope it out of the history scan so it stops re-firing.
    '''^backups/.*''',
]

regexes = [
    # AWS public example key — documented by AWS, not a real credential.
    '''AKIAIOSFODNN7EXAMPLE''',
    # Common placeholder patterns used in plugin bodies.
    '''your[-_](api[-_])?key[-_]here''',
    '''YOUR_[A-Z_]+_HERE''',
    '''xxx+''',
    '''\*\*\*+''',
    '''placeholder''',
    '''replace[-_]me''',
    '''example\.com''',
    # Firebase Web (browser) API key from the now-retired Firebase-hosted
    # version of marketplace/src/layouts/BaseLayout.astro (the single
    # gcp-api-key hit at commit 44933759:52; the firebaseConfig block has since
    # been removed — the current site uses Umami, no Firebase). Firebase Web
    # API keys are public by design: Google ships them in client-side config
    # and documents that they are safe to commit (access is gated by Security
    # Rules + App Check, not by key secrecy). The default gcp-api-key rule
    # flags the AIzaSy… shape regardless. Allowlist the exact value, NOT the
    # .astro path, so a real server key ever added to an .astro file still
    # surfaces.
    '''AIzaSyAUbgBuoMCtcjEdRcYzqu08kuVFVDeiHsM''',
]
