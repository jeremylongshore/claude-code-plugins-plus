# Deploy: serverless API wrapper is the typical pattern
deploy_pattern: serverless_api_wrapper
deploy_description: |
  AI/ML integrations typically deploy as stateless API wrappers — a thin
  serverless function that receives user requests, calls the model API,
  and returns results. No persistent state needed.
