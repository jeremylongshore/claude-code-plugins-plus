# Deploy: these ARE deploy tools — meta-deploy pattern
deploy_pattern: platform_native
deploy_description: |
  Developer tool integrations deploy via the platform's own CLI or Git push.
  Config lives in the project repo (vercel.json, fly.toml, etc.) and
  deploys trigger automatically on git push or via CLI.
