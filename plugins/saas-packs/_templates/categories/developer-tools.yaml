# Developer Tools Category Defaults
# Applies to: vercel, flyio, stackblitz, replit, firecrawl, serpapi, apify,
#   cursor, windsurf, coderabbit, clerk, lokalise
# Auth: API key or CLI token. Mix of REST + CLI. Usage-based billing.

auth_pattern: api_key
auth_env_suffix: API_KEY
auth_header: "Authorization: Bearer $API_KEY"

# Hello world: deploy or create something, not just read
hello_world_ts: |
  const projects = await client.projects.list();
  console.log(`Found ${projects.length} projects:`);
  projects.forEach(p => console.log(`  - ${p.name} (${p.status})`));
hello_world_py: |
  projects = client.projects.list()
  print(f"Found {len(projects)} projects:")
  for p in projects:
      print(f"  - {p.name} ({p.status})")

verification_code: |
  const user = await client.user.get();
  console.log(`Authenticated as ${user.name} (${user.email})`);

# Primary workflow: Deploy & Preview
workflow_a_slug: deploy-preview
workflow_a_name: Deploy & Preview
workflow_a_description: |
  Deploy applications and create preview environments for branches/PRs.
  This is the primary workflow — ship code from local to production.
workflow_a_trigger: deploy
workflow_a_action: deploy application
workflow_a_use_case_1: deploying a preview for every pull request
workflow_a_use_case_2: promoting staging to production
workflow_a_use_case_3: rolling back a bad deployment
workflow_a_step1_name: Configure Deployment
workflow_a_step1_code: |
  const deployConfig = {
    project: process.env.PROJECT_ID,
    branch: 'main',
    env: {
      NODE_ENV: 'production',
      API_URL: process.env.API_URL,
    },
  };
workflow_a_step2_name: Trigger Deploy
workflow_a_step2_code: |
  const deployment = await client.deployments.create({
    ...deployConfig,
    production: false, // preview first
  });
  console.log(`Deploy started: ${deployment.url}`);
  console.log(`Status: ${deployment.status}`);
workflow_a_step3_name: Monitor and Promote
workflow_a_step3_code: |
  // Wait for build to complete
  const result = await client.deployments.wait(deployment.id);
  if (result.status === 'ready') {
    console.log(`Preview live at: ${result.url}`);
    // Promote to production when ready
    // await client.deployments.promote(deployment.id);
  }
workflow_a_error1_name: Build Failed
workflow_a_error1_cause: Build script exited with non-zero code (dependency or compile error)
workflow_a_error1_solution: Check build logs. Run build locally to reproduce. Fix dependency issues.
workflow_a_error2_name: Deploy Timeout
workflow_a_error2_cause: Build or health check exceeded time limit
workflow_a_error2_solution: Optimize build step, reduce bundle size, or increase timeout setting.
workflow_a_complete_example: |
  // Full deploy pipeline: build → preview → verify → promote
  const client = new DevClient({ token: process.env.API_KEY });

  const deploy = await client.deployments.create({
    project: 'my-app',
    branch: process.env.GITHUB_REF,
  });

  const result = await client.deployments.wait(deploy.id);
  console.log(`Deployed to: ${result.url} (${result.status})`);
workflow_a_variations: |
  - **Preview per PR**: Auto-deploy on pull_request webhook events
  - **Rollback**: Instantly revert to previous deployment by ID
  - **Environment promotion**: Deploy to staging first, then promote to production

# Secondary workflow: Build & Configure
workflow_b_slug: build-configure
workflow_b_name: Build & Configure
workflow_b_description: |
  Configure project settings, environment variables, and build pipelines.
  The setup workflow that makes deployments reproducible.
workflow_b_trigger: configure
workflow_b_action: configure project
workflow_b_use_case_1: setting environment variables for different stages
workflow_b_use_case_2: configuring build commands and output directories
workflow_b_step1_name: Set Environment Variables
workflow_b_step1_code: |
  await client.env.create(projectId, [
    { key: 'DATABASE_URL', value: dbUrl, target: ['production'] },
    { key: 'API_SECRET', value: secret, target: ['production', 'preview'] },
  ]);
workflow_b_step2_name: Configure Build Settings
workflow_b_step2_code: |
  await client.projects.update(projectId, {
    buildCommand: 'npm run build',
    outputDirectory: 'dist',
    installCommand: 'npm ci',
    framework: 'astro',
  });
workflow_b_step3_name: Verify Configuration
workflow_b_step3_code: |
  const config = await client.projects.get(projectId);
  console.log('Build:', config.buildCommand);
  console.log('Output:', config.outputDirectory);
  console.log('Env vars:', (await client.env.list(projectId)).length);
workflow_b_complexity: Low
workflow_b_perf: Instant (API calls only)
workflow_b_complete_example: |
  // Full project setup from scratch
  async function setupProject(name: string) {
    const project = await client.projects.create({ name, framework: 'nextjs' });
    await client.env.create(project.id, envVars);
    await client.domains.add(project.id, `${name}.example.com`);
    return project;
  }
workflow_b_error_handling: |
  try {
    await client.env.create(projectId, envVars);
  } catch (err) {
    if (err.code === 'env_already_exists') {
      await client.env.update(projectId, envVars); // update instead
    } else {
      throw err;
    }
  }

# Error patterns for dev tools
error_1_name: Build Failed
error_1_message: "Error: Command 'npm run build' exited with code 1"
error_1_cause: Compilation error, missing dependency, or misconfigured build command.
error_1_solution: |
  # Reproduce locally
  npm run build
  # Check for missing env vars that build depends on
  # Verify Node.js version matches platform runtime

error_2_name: Function Timeout
error_2_message: "FUNCTION_INVOCATION_TIMEOUT: Task timed out after 30s"
error_2_cause: Serverless function exceeded execution time limit.
error_2_solution: |
  # Profile function execution time locally
  # Move heavy computation to background jobs
  # Use Edge Runtime for faster cold starts
  # Upgrade plan for longer timeouts (60s Pro, 300s Enterprise)

error_3_name: Domain Verification Failed
error_3_message: "Error: Domain verification failed — DNS records not found"
error_3_cause: Required DNS records (CNAME or A record) not configured at registrar.
error_3_solution: |
  # Add the required DNS record at your registrar
  # CNAME for subdomains: app.example.com → cname.provider.com
  # A record for apex: example.com → 76.76.21.21
  # Allow up to 48h for DNS propagation

