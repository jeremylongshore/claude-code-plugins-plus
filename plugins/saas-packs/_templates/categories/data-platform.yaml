# Deploy: long-running data pipeline worker
deploy_pattern: data_pipeline_worker
deploy_description: |
  Data platform integrations deploy as persistent workers or scheduled jobs —
  ETL pipelines, cron-driven aggregations, or streaming consumers that maintain
  database connections and process data continuously.
