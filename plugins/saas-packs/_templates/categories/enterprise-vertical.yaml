deploy_pattern: scheduled_sync_worker
deploy_description: |
  Enterprise integrations deploy as scheduled sync workers — cron-driven
  jobs that pull changes, transform data, and push to connected systems.
  Often deployed in the enterprise's own cloud (not public internet) with
  VPN/VPC peering for secure access.
