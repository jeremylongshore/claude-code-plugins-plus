# Infrastructure & Ops Category Defaults
# Applies to: sentry, coreweave, vastai, castai, brightdata
# Auth: API key or org token. Resource/event-based. Usage billing.

auth_pattern: api_key
auth_env_suffix: API_KEY
auth_header: "Authorization: Bearer $API_KEY"

# Hello world: check system status — the ops baseline
hello_world_ts: |
  const projects = await client.projects.list();
  console.log(`Monitoring ${projects.length} projects:`);
  projects.forEach(p => console.log(`  - ${p.name}: ${p.status} (${p.eventCount} events/24h)`));
hello_world_py: |
  projects = client.projects.list()
  print(f"Monitoring {len(projects)} projects:")
  for p in projects:
      print(f"  - {p.name}: {p.status} ({p.event_count} events/24h)")

verification_code: |
  const org = await client.organization.get();
  console.log(`Connected: ${org.name} — ${org.projects.length} projects`);

# Primary workflow: Monitor & Alert
workflow_a_slug: monitor-alert
workflow_a_name: Monitor & Alert
workflow_a_description: |
  Set up monitoring, configure alerts, and track system health metrics.
  This is the primary workflow — know when things break before users tell you.
workflow_a_trigger: monitor
workflow_a_action: configure monitoring
workflow_a_use_case_1: setting up error tracking and alerting for production apps
workflow_a_use_case_2: configuring performance monitoring thresholds
workflow_a_use_case_3: building custom dashboards from infrastructure metrics
workflow_a_step1_name: Configure Monitoring
workflow_a_step1_code: |
  // Initialize SDK in your application
  const monitor = client.init({
    dsn: process.env.MONITOR_DSN,
    environment: process.env.NODE_ENV,
    tracesSampleRate: 0.1,   // 10% of transactions
    profilesSampleRate: 0.01, // 1% of transactions
  });
workflow_a_step2_name: Set Alert Rules
workflow_a_step2_code: |
  const alert = await client.alerts.create({
    name: 'Error Spike',
    conditions: [
      { type: 'event_frequency', value: 100, interval: '5m' },
    ],
    actions: [
      { type: 'slack', channel: '#oncall' },
      { type: 'pagerduty', severity: 'warning' },
    ],
    project: projectId,
  });
  console.log(`Alert rule created: ${alert.id}`);
workflow_a_step3_name: Query Events
workflow_a_step3_code: |
  const events = await client.events.list({
    project: projectId,
    query: 'is:unresolved level:error',
    sort: 'last_seen',
    limit: 20,
  });
  console.log(`${events.total} unresolved errors:`);
  events.data.forEach(e => console.log(`  [${e.count}x] ${e.title}`));
workflow_a_error1_name: DSN Invalid
workflow_a_error1_cause: Monitoring DSN is malformed or project has been deleted
workflow_a_error1_solution: Copy DSN from project settings. Verify project exists and is active.
workflow_a_error2_name: Quota Exceeded
workflow_a_error2_cause: Monthly event quota exhausted — events being dropped
workflow_a_error2_solution: Increase sample rate filtering. Upgrade plan. Set rate limits on noisy events.
workflow_a_complete_example: |
  const client = new InfraClient({ apiKey: process.env.API_KEY });

  async function setupMonitoring(projectId: string) {
    // Create alert for error spikes
    await client.alerts.create({
      project: projectId,
      name: 'P0 Error Spike',
      conditions: [{ type: 'event_frequency', value: 50, interval: '5m' }],
      actions: [{ type: 'slack', channel: '#oncall' }],
    });
    // Create alert for latency degradation
    await client.alerts.create({
      project: projectId,
      name: 'Latency P95 > 2s',
      conditions: [{ type: 'metric', metric: 'transaction.duration', threshold: 2000, percentile: 95 }],
      actions: [{ type: 'pagerduty', severity: 'critical' }],
    });
  }
workflow_a_variations: |
  - **Error tracking**: Capture and group exceptions with stack traces
  - **Performance monitoring**: Track transaction latency, throughput, and Apdex
  - **Infrastructure metrics**: CPU, memory, disk, network per host/container

# Secondary workflow: Resource Management
workflow_b_slug: resource-management
workflow_b_name: Resource Management
workflow_b_description: |
  Provision, scale, and manage infrastructure resources programmatically.
  The capacity workflow — right-size your infrastructure for demand.
workflow_b_trigger: manage resources
workflow_b_action: provision infrastructure
workflow_b_use_case_1: provisioning GPU instances for ML workloads
workflow_b_use_case_2: auto-scaling infrastructure based on demand
workflow_b_step1_name: List Available Resources
workflow_b_step1_code: |
  const resources = await client.resources.list({
    type: 'compute',
    status: 'available',
  });
  console.log(`${resources.total} compute resources available`);
  resources.data.forEach(r => console.log(`  ${r.type}: ${r.specs} — $${r.pricePerHour}/hr`));
workflow_b_step2_name: Provision Instance
workflow_b_step2_code: |
  const instance = await client.instances.create({
    type: 'gpu',
    specs: { gpu: 'A100', vram: '80GB', vcpus: 16, ram: '128GB' },
    region: 'us-east-1',
    image: 'pytorch-2.1-cuda12',
  });
  console.log(`Instance ${instance.id} provisioning... IP: ${instance.ip}`);
workflow_b_step3_name: Monitor and Scale
workflow_b_step3_code: |
  const metrics = await client.instances.metrics(instance.id, {
    period: '1h',
    metrics: ['gpu_utilization', 'memory_used', 'network_in'],
  });
  if (metrics.gpu_utilization.avg < 0.2) {
    console.log('GPU underutilized — consider downscaling');
    // await client.instances.resize(instance.id, { type: 'gpu-small' });
  }
workflow_b_complexity: Medium-High
workflow_b_perf: Provisioning takes 30s-5min depending on resource type
workflow_b_complete_example: |
  async function autoscale(threshold: number) {
    const instances = await client.instances.list({ status: 'running' });
    const avgUtil = instances.data.reduce((s, i) => s + i.gpuUtil, 0) / instances.data.length;
    if (avgUtil > threshold) {
      await client.instances.create({ type: 'gpu', specs: defaultSpecs });
      console.log('Scaled up: added 1 instance');
    }
  }
workflow_b_error_handling: |
  try {
    const instance = await client.instances.create(config);
    return instance;
  } catch (err) {
    if (err.code === 'insufficient_capacity') {
      console.error('No capacity in requested region. Trying fallback...');
      return client.instances.create({ ...config, region: fallbackRegion });
    } else if (err.code === 'quota_exceeded') {
      console.error('Instance quota reached. Request increase from dashboard.');
    }
    throw err;
  }

# Error patterns for infra/ops platforms
error_1_name: Event Quota Exceeded
error_1_message: "429 Event Dropped: Monthly quota of 100,000 events exceeded"
error_1_cause: Exceeded monthly event ingestion limit. Events are silently dropped.
error_1_solution: |
  # Check current usage in billing dashboard
  # Reduce sample rate for high-volume events
  # Set up spike protection: client.init({ maxBreadcrumbs: 50 })
  # Upgrade plan or purchase additional quota

error_2_name: Instance Capacity Unavailable
error_2_message: "503 Service Unavailable: No capacity for gpu.a100 in us-east-1"
error_2_cause: Requested GPU/compute type is fully allocated in the target region.
error_2_solution: |
  # Try alternative regions or instance types
  # Use spot/preemptible instances if workload tolerates interruption
  # Set up capacity reservation for guaranteed availability
  # Enable multi-region fallback in provisioning logic

error_3_name: Agent Connection Lost
error_3_message: "Warning: Agent heartbeat missed for host web-prod-3 (last seen 5m ago)"
error_3_cause: Monitoring agent on the host stopped reporting. Host may be down or network issue.
error_3_solution: |
  # SSH into host and check agent status
  systemctl status monitoring-agent
  # Check agent logs for errors
  journalctl -u monitoring-agent --since "10 minutes ago"
  # Restart agent if process died
  systemctl restart monitoring-agent

