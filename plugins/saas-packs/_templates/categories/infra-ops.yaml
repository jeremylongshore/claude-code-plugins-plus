deploy_pattern: sidecar_agent
deploy_description: |
  Infra/ops integrations deploy as sidecar agents or init containers alongside
  your application. The agent collects metrics, errors, and traces, then ships
  them to the platform. Also requires webhook endpoints for alert routing.
